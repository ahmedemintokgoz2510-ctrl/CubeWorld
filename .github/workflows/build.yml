name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v2
      - name: Extract ZIP
        run: unzip -q CubeWorld-Personalized.zip && mv luanti-master android-project
      - name: Build APK
        run: cd android-project/android && chmod +x gradlew && ./gradlew assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: CubeWorld-APK
          path: android-project/android/app/build/outputs/apk/release/app-release.apk
